<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Συντήρηση / Maintenance</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f4;
    --fg: #1c1917;
    --muted: #6b6862;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17140f; --fg: #f2f0ed; --muted: #a29c92; }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  main { max-width: 32rem; }
  h1 {
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    margin: 0 0 0.5rem;
    font-weight: 600;
  }
  p.sub {
    font-size: 1.05rem;
    color: var(--muted);
    margin: 0 0 1.5rem;
  }
  p.note {
    font-size: 0.9rem;
    color: var(--muted);
    margin: 0;
  }
</style>
</head>
<body>
  <main>
    <h1>Επιστρέφουμε σε λίγο</h1>
    <p class="sub">We&rsquo;ll be back shortly.</p>
    <p class="note">Εκτελείται προγραμματισμένη συντήρηση — δοκιμάστε ξανά σε λίγα λεπτά.<br>
    Scheduled maintenance is in progress — please try again in a few minutes.</p>
  </main>
</body>
</html>
