name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest interpreter this project claims to support (pyproject.toml's
        # requires-python) plus the newest generally available, so a version-
        # specific regression doesn't slip through on either end.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install akropolis with test dependencies
        run: python -m pip install --quiet -e ".[test]"

      - name: Run tests
        run: python -m pytest tests/ -v
